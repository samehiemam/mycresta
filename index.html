<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <link rel="icon" href="/images/cresta-mark-navy.png" />
    <link rel="shortcut icon" href="/images/cresta-mark-navy.png" />

    <!--
      The fonts were reached by an @import at the top of globals.css, which is
      the slowest way to ask for them: the browser has to fetch the stylesheet
      and parse it before it even learns fonts.gstatic.com exists, then open
      two more connections in series before any text can be painted.

      Asking here instead means the request goes out with the stylesheet
      rather than after it, and the preconnects open both third-party
      connections while the CSS is still in flight. Same 104kB, three
      round trips earlier.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Jost:wght@400;500;600&display=swap"
    />
    <title>Cresta Marine | Beyond the Day Trip</title>
    <meta
      name="description"
      content="Cresta Marine is the Kumbra Yachts dealer at Abu Tig Marina, El Gouna. Island-hop the Red Sea, anchor somewhere quiet, and stay the night on board."
    />
    <!--
      build/seo.ts strips every tag below and re-emits it per route, so what
      ships is whatever that file says. These are kept in step with the home
      route it writes rather than left to drift, because they are what the dev
      server and any unprocessed copy of this template actually serve.
    -->
    <meta property="og:title" content="Cresta Marine | Beyond the Day Trip" />
    <meta
      property="og:description"
      content="Cresta Marine is the Kumbra Yachts dealer at Abu Tig Marina, El Gouna. Island-hop the Red Sea, anchor somewhere quiet, and stay the night on board."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://crestamarine.com/og-cover-3.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cresta Marine | Beyond the Day Trip" />
    <meta
      name="twitter:description"
      content="Cresta Marine is the Kumbra Yachts dealer at Abu Tig Marina, El Gouna. Island-hop the Red Sea, anchor somewhere quiet, and stay the night on board."
    />
    <meta name="twitter:image" content="https://crestamarine.com/og-cover-3.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
