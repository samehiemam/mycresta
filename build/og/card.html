<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Brand tokens, copied verbatim from app/globals.css :root */
  :root {
    --navy-900: #081d33;
    --sand-500: #c9ae81;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: var(--navy-900);
    font-family: "Jost", sans-serif;
    color: var(--white);
    overflow: hidden;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* The boat sits right of centre in the frame; nudging the crop that way
       keeps it clear of the copy rather than behind it. */
    object-position: 62% 55%;
  }

  /* The desktop hero's own wash, copied so a shared link and the page it opens
     read as the same design rather than two takes on it. */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(8,29,51,0.95) 0%, rgba(8,29,51,0.72) 44%, rgba(8,29,51,0.14) 78%),
      linear-gradient(0deg, rgba(8,29,51,0.74), transparent 44%);
  }

  .content {
    position: absolute;
    left: 76px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    max-width: 720px;
  }

  .logo { width: 390px; display: block; }

  .rule {
    width: 92px;
    height: 3px;
    background: var(--sand-500);
    margin: 32px 0 28px;
    border-radius: 2px;
  }

  .kicker {
    color: #b3dfe3;
    display: block;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  h1 {
    /* Sized to hold on one line: wrapped, the second line ran down into the
       hull and the headline started competing with the boat behind it. */
    font-size: 60px;
    font-weight: 500;
    line-height: 1.04;
    white-space: nowrap;
    letter-spacing: -0.015em;
    margin-top: 14px;
  }

  .sub {
    margin-top: 24px;
    font-size: 25px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="/images/hero-home-k43-side-Dk6eFIXz.jpg" alt="" />
    <div class="scrim"></div>

    <div class="content">
      <img class="logo" src="/images/cresta-logo-white.png" alt="Cresta Marine" />
      <div class="rule"></div>
      <span class="kicker">Beyond the day trip</span>
      <h1>Wake up to the waves.</h1>
      <p class="sub">Kumbra Yachts · Abu Tig Marina, El Gouna</p>
    </div>
  </div>
</body>
</html>
